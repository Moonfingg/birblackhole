<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bienvenue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Exo+2:wght@200;300;400;600&family=Noto+Serif:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;color:#fff;font-family:'Exo 2','Noto Serif',system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none}
#stage{position:fixed;inset:0;will-change:transform}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx,#rg{pointer-events:none}
#fb{position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;margin:-23vmin 0 0 -23vmin;border-radius:50%;display:none;
  background:radial-gradient(circle,#000 0 24%,#ffd9a0 27%,#ff8a30 36%,#7a2a00 50%,transparent 68%)}

/* ---------- Bienvenue ---------- */
#title{position:absolute;left:0;right:0;top:10vh;text-align:center;font-family:'Cinzel',serif;font-weight:700;
  font-size:clamp(32px,8.2vw,96px);letter-spacing:.36em;padding-left:.36em;color:#ffe9c8;pointer-events:none;z-index:3;white-space:nowrap}
#title span{display:inline-block;opacity:0;filter:blur(20px);transform:translateY(26px) scaleY(1.9) rotate(var(--rot,0deg));
  text-shadow:0 0 18px rgba(255,150,60,.85),0 0 60px rgba(255,100,20,.45)}
#title.show span{animation:letterIn 2s cubic-bezier(.2,.8,.2,1) forwards,breathe 5.5s ease-in-out infinite;animation-fill-mode:forwards,none}
@keyframes letterIn{to{opacity:1;filter:blur(0);transform:translateY(0) scaleY(1) rotate(var(--rot,0deg))}}
@keyframes breathe{0%,100%{text-shadow:0 0 14px rgba(255,150,60,.65),0 0 46px rgba(255,100,20,.3)}50%{text-shadow:0 0 26px rgba(255,190,100,1),0 0 90px rgba(255,120,30,.6)}}
#title.suck{transition:transform 3.2s cubic-bezier(.65,0,1,.55),opacity 3.2s ease-in,filter 3.2s ease-in;transform:translateY(34vh) scale(.1);opacity:0;filter:blur(8px)}

#hint{position:absolute;left:50%;top:75vh;width:min(180px,40vw);height:1px;margin-left:calc(min(180px,40vw)/-2);z-index:3;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,220,170,.55),transparent);transition:opacity 2s}
#hint.on{opacity:1;animation:hintPulse 3.4s ease-in-out infinite}
#hint.off{opacity:0!important;animation:none}
@keyframes hintPulse{0%,100%{opacity:.08}50%{opacity:.5}}
#code{position:absolute;left:50%;top:68vh;width:240px;height:90px;margin-left:-120px;z-index:4;opacity:0;border:0;background:transparent;color:transparent;caret-color:transparent;font-size:16px;outline:none}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:end center;padding-bottom:16vh;cursor:pointer;background:radial-gradient(circle,rgba(0,0,0,0) 30%,rgba(0,0,0,.55));transition:opacity 1.6s ease,visibility 1.6s}
#gate.gone{opacity:0;visibility:hidden;pointer-events:none}
.gateTxt{font-weight:200;letter-spacing:.42em;text-transform:uppercase;font-size:clamp(11px,2.6vw,15px);color:rgba(255,230,200,.85);animation:gt 3s ease-in-out infinite;text-align:center;padding:0 24px}
@keyframes gt{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- orb buttons ---------- */
.orb{--s:54px;position:relative;width:var(--s);height:var(--s);border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:#ffe9c8;outline:none;
  background:radial-gradient(circle at 50% 38%,rgba(255,200,140,.22),rgba(8,8,22,.65) 72%);
  box-shadow:0 0 0 1px rgba(255,220,170,.28) inset,0 0 26px rgba(255,140,50,.16);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,color .35s;flex:none}
.orb::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(255,210,150,.5);animation:spin 16s linear infinite;transition:border-color .3s}
.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid transparent;border-top-color:rgba(160,210,255,.85);border-bottom-color:rgba(255,170,90,.55);animation:spin 5.5s linear infinite reverse;transition:inset .35s}
.orb:hover{transform:scale(1.1);color:#fff;box-shadow:0 0 0 1px rgba(255,235,200,.6) inset,0 0 40px rgba(255,160,70,.55),0 0 90px rgba(120,170,255,.25)}
.orb:hover::before{animation-duration:3.5s;border-color:rgba(255,235,190,.95)}
.orb:hover::after{inset:-18px;animation-duration:1.8s}
.orb:active{transform:scale(.92)}
.orb svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;position:relative}
.orb.big{--s:118px}
.orb.big svg{width:42%;height:42%}
.orb.small{--s:42px}
.orb.pulse{animation:orbPulse 2.2s ease-in-out infinite}
@keyframes orbPulse{0%,100%{box-shadow:0 0 0 1px rgba(255,220,170,.35) inset,0 0 26px rgba(255,140,50,.25)}50%{box-shadow:0 0 0 1px rgba(255,235,200,.8) inset,0 0 60px rgba(255,170,80,.7),0 0 120px rgba(120,170,255,.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
#snd{position:absolute;right:calc(26px + env(safe-area-inset-right));top:calc(26px + env(safe-area-inset-top));z-index:15;opacity:0;pointer-events:none;transition:opacity 1.5s}
#snd.on{opacity:1;pointer-events:auto}
#snd .slash{opacity:0;transition:opacity .2s}
#snd.muted .slash{opacity:1}
#snd.muted .wave{opacity:.25}

/* ---------- HUD ---------- */
#hud{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:26px;z-index:12;opacity:0;pointer-events:none;transition:opacity 1.2s}
#hud.on{opacity:1;pointer-events:auto}
#dots{display:flex;gap:9px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22);position:relative;cursor:pointer;transition:background .4s,box-shadow .4s,transform .4s}
.dot:hover{transform:scale(1.5);background:rgba(255,230,190,.7)}
.dot.on{background:#ffd9a0;box-shadow:0 0 14px #ff9a3c;transform:scale(1.25)}
.dot.on::after{content:"";position:absolute;inset:-6px;border:1px solid rgba(255,200,140,.6);border-radius:50%;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
@media(max-width:560px){#hud{gap:18px}.orb{--s:46px}.orb.big{--s:104px}#dots{gap:6px}.dot{width:7px;height:7px}}

/* ---------- deck ---------- */
#deck{position:absolute;inset:0;z-index:5;visibility:hidden;perspective:1300px}
#deck.masked{-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 calc(var(--r)*1px - 140px),transparent calc(var(--r)*1px));
  mask-image:radial-gradient(circle at 50% 50%,#000 calc(var(--r)*1px - 140px),transparent calc(var(--r)*1px))}
#slides{position:absolute;inset:0;transform-style:preserve-3d}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,220,170,.3) transparent;padding:4vh 5vw 0;opacity:0;pointer-events:none;
  transition:opacity var(--td,.95s) ease,transform var(--td,.95s) cubic-bezier(.2,.8,.2,1),filter var(--td,.95s) ease;will-change:transform,opacity,filter}
.slide.before{transform:translate3d(-9vw,0,-280px) scale(.94) rotateY(8deg);filter:blur(14px)}
.slide.after{transform:translate3d(9vw,0,-280px) scale(.94) rotateY(-8deg);filter:blur(14px)}
.slide.active{opacity:1;pointer-events:auto;transform:none;filter:none}
.card{position:relative;width:min(900px,100%);padding:clamp(28px,5vw,64px);border-radius:28px;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.02) 40%,rgba(10,12,28,.55));
  border:1px solid rgba(255,230,200,.16);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:0 30px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset,0 0 80px rgba(255,140,50,.07)}
.card::before{content:"";position:absolute;left:-30%;top:0;width:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,220,170,.9),transparent);animation:sweep 6s linear infinite}
@keyframes sweep{from{left:-60%}to{left:110%}}
.card .num{font-family:'Cinzel',serif;font-size:clamp(60px,14vw,150px);line-height:.9;font-weight:700;position:absolute;right:28px;top:14px;color:transparent;-webkit-text-stroke:1px rgba(255,220,170,.22);pointer-events:none}
.card h2{font-family:'Noto Serif',serif;font-weight:300;font-size:clamp(28px,5vw,58px);letter-spacing:.04em;margin-bottom:.5em;color:#fff2de;text-shadow:0 0 30px rgba(255,160,70,.35);max-width:80%}
.card p{font-weight:300;font-size:clamp(15px,2.2vw,22px);line-height:1.65;color:rgba(235,240,255,.85);max-width:46em}
.card>*:not(.num){opacity:0;transform:translateY(20px);filter:blur(6px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .8s}
.slide.active .card>*:not(.num){opacity:1;transform:none;filter:none;transition-delay:calc(var(--i,0)*.1s + .3s)}
.rewwrap{display:flex;flex-direction:column;align-items:center;gap:26px;margin-top:34px}
.rewcap{font-weight:200;letter-spacing:.5em;text-transform:uppercase;font-size:12px;color:rgba(255,225,190,.8);padding-left:.5em}

/* rewind look */
#deck.rew .slide{--td:.2s}
#deck.rew .slide.after{transform:translate3d(26vw,0,-520px) scale(.78) rotateY(-28deg);filter:blur(10px) hue-rotate(40deg)}
#deck.rew .slide.before{transform:translate3d(-26vw,0,-520px) scale(.78) rotateY(28deg)}
#deck.rew .slide .card>*:not(.num){transition-delay:0s!important;transition-duration:.18s}
#deck.rew .slide.active .card{animation:glitch .16s steps(2) infinite;text-shadow:3px 0 rgba(255,40,90,.55),-3px 0 rgba(40,200,255,.55)}
@keyframes glitch{0%{transform:translate(0,0) skewX(0)}25%{transform:translate(-4px,1px) skewX(-1deg)}50%{transform:translate(3px,-2px) skewX(1deg)}75%{transform:translate(-2px,2px)}100%{transform:translate(0,0)}}
#rewOverlay{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .6s;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px),radial-gradient(circle,transparent 35%,rgba(70,110,255,.22) 100%);mix-blend-mode:screen}
#rewOverlay.on{opacity:1;animation:flick .14s steps(2) infinite}
@keyframes flick{0%{transform:translateY(0)}50%{transform:translateY(-3px)}100%{transform:translateY(2px)}}

/* ---------- final ---------- */
#final{position:absolute;left:0;right:0;top:9vh;text-align:center;font-family:'Noto Serif','Exo 2',serif;font-weight:300;font-size:clamp(26px,6.4vw,74px);
  letter-spacing:.05em;line-height:1.25;color:#fff7e0;z-index:8;pointer-events:none;padding:0 4vw}
#final span{display:inline-block;opacity:0;filter:blur(16px);transform:translateY(22px) scale(1.25);
  text-shadow:0 0 22px rgba(255,215,130,.95),0 0 70px rgba(255,170,60,.55)}
#final.show span{animation:finIn 1.9s cubic-bezier(.2,.8,.2,1) forwards,finGlow 5s ease-in-out infinite;animation-fill-mode:forwards,none}
@keyframes finIn{to{opacity:1;filter:blur(0);transform:none}}
@keyframes finGlow{0%,100%{text-shadow:0 0 18px rgba(255,215,130,.8),0 0 60px rgba(255,170,60,.45)}50%{text-shadow:0 0 34px rgba(255,235,170,1),0 0 110px rgba(255,190,80,.75)}}
#again{position:absolute;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));margin-left:-27px;z-index:12;opacity:0;pointer-events:none;transition:opacity 2s}
#again.on{opacity:1;pointer-events:auto}

/* =====================================================================
   КОНТЕНТ СЛАЙДОВ (перенесён из «Tocopy», оформлен в стиле index)
   ===================================================================== */
.slide::after{content:"";flex:0 0 120px}
.slide::-webkit-scrollbar{width:6px}
.slide::-webkit-scrollbar-thumb{background:rgba(255,220,170,.28);border-radius:9px}
.card{margin:auto;flex:none}
.card.wide{width:min(1120px,100%);padding:clamp(20px,3.4vw,50px)}
.card.wide h2{max-width:88%}
.card .kicker{font-weight:200;letter-spacing:.5em;text-transform:uppercase;font-size:12px;line-height:1.6;color:rgba(255,225,190,.8);margin-bottom:20px;padding-left:.1em;max-width:78%}
.card h3{font-family:'Noto Serif',serif;font-weight:400;font-size:clamp(17px,1.9vw,22px);letter-spacing:.02em;color:#fff2de;margin-bottom:.45em}
.card>h3{margin:8px 0 14px}
.card p.lead{margin-bottom:1.5em}
.card p.note{font-size:13px;line-height:1.6;color:rgba(235,240,255,.55);margin-top:14px}
.card b{font-weight:600}
.hl{color:#ffd9a0;text-shadow:0 0 22px rgba(255,150,60,.4)}
.mut{color:rgba(235,240,255,.5)}
.shine{background:linear-gradient(90deg,#ffd9a0,#fff,#9fd0ff,#ffd9a0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-300% 0}}
.card h2.subhead{font-size:clamp(20px,2.8vw,32px);margin:38px 0 16px;max-width:none}

/* ---- появление внутренних блоков ---- */
.rv,.rvf{opacity:0;transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .8s;transition-delay:var(--d,.5s)}
.rv{transform:translateY(22px);filter:blur(6px)}
.rv.l{transform:translateX(-46px)}
.rv.r{transform:translateX(46px)}
.rv.z{transform:scale(.88)}
.slide.active .rv,.slide.active .rvf{opacity:1}
.slide.active .rv{transform:none;filter:none}
.slide:not(.active) .rv,.slide:not(.active) .rvf{transition-duration:.25s;transition-delay:0s}
.ic.rv{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .8s,translate .35s,border-color .35s,box-shadow .35s;
  transition-delay:var(--d,.5s),var(--d,.5s),var(--d,.5s),0s,0s,0s}
.slide:not(.active) .ic.rv{transition-duration:.25s,.25s,.25s,.35s,.35s,.35s;transition-delay:0s}
#deck.rew .slide .rv,#deck.rew .slide .rvf{transition-duration:.18s;transition-delay:0s!important}

/* ---- сетки и внутренние карточки ---- */
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.card>.grid{margin:6px 0 22px}
.ic{position:relative;padding:22px;border-radius:20px;
  background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.015) 45%,rgba(10,12,28,.45));
  border:1px solid rgba(255,230,200,.13)}
.ic:hover{translate:0 -4px;border-color:rgba(255,220,170,.38);box-shadow:0 18px 50px rgba(0,0,0,.4),0 0 40px rgba(255,140,50,.12)}
.ic.hot{border-color:rgba(255,210,150,.5);box-shadow:0 0 50px rgba(255,140,50,.14)}
.ic.wideic{margin-top:16px}
.ic h3{font-size:clamp(17px,1.7vw,20px);margin-bottom:8px}
.ic p,.ic li{font-size:14.5px;line-height:1.65;font-weight:300;color:rgba(235,240,255,.74);max-width:none}
.ic p+p{margin-top:6px}
.ic ul{padding-left:18px;margin-top:8px}
.ic li{margin-bottom:5px}
.ic li::marker{color:rgba(255,200,140,.75)}
.ic .tag{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;margin:0 0 8px}
.tag.bad{color:#ff9a86}
.tag.good{color:#ffd9a0}
.bignum{font-family:'Noto Serif',serif;font-weight:300;font-size:clamp(26px,3.6vw,44px);line-height:1.1;color:#ffd9a0;text-shadow:0 0 28px rgba(255,150,60,.4)}
.bignum.sm{font-size:clamp(20px,2.4vw,30px);margin-top:4px}
.ic .bignum+p{margin-top:10px}

/* ---- 1 слайд: статистика, кнопка ---- */
.stats{display:flex;flex-wrap:wrap;gap:14px;margin:30px 0 32px}
.stat{flex:1 1 150px;min-width:0;padding:16px 20px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,230,200,.14)}
.stat b{display:block;font-family:'Noto Serif',serif;font-weight:400;font-size:clamp(19px,2.4vw,28px);line-height:1.2;white-space:nowrap}
.stat>span{display:block;margin-top:6px;font-size:13px;font-weight:300;color:rgba(235,240,255,.6)}
.btn{position:relative;overflow:hidden;border:1px solid rgba(255,225,190,.55);border-radius:999px;padding:14px 38px;cursor:pointer;
  font:inherit;font-weight:300;letter-spacing:.3em;text-transform:uppercase;font-size:13px;color:#fff2de;
  background:radial-gradient(circle at 50% 30%,rgba(255,200,140,.28),rgba(30,16,8,.55));
  box-shadow:0 0 30px rgba(255,140,50,.2);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,240,210,.45),transparent);transform:skewX(-20deg);animation:btnSweep 3.4s ease-in-out infinite}
@keyframes btnSweep{0%,55%{left:-60%}100%{left:130%}}
.btn:hover{transform:scale(1.06);border-color:rgba(255,235,200,.95);box-shadow:0 0 50px rgba(255,160,70,.55)}
.btn:active{transform:scale(.95)}
.by{margin-top:28px;font-size:14px;font-weight:300;letter-spacing:.06em;color:rgba(235,240,255,.6)}
.by b{color:#fff2de;font-weight:400}
.slide p b{color:#fff2de}

/* ---- таблица товаров ---- */
.tblwrap{overflow-x:auto;border-radius:20px;background:rgba(255,255,255,.03);border:1px solid rgba(255,230,200,.13);padding:6px 16px}
.tblwrap table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:720px}
.tblwrap th,.tblwrap td{padding:12px 10px;text-align:right;border-bottom:1px solid rgba(255,230,200,.09);white-space:nowrap;font-weight:300}
.tblwrap th:first-child,.tblwrap td:first-child{text-align:left}
.tblwrap th{color:rgba(235,240,255,.55);font-weight:400;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em}
.tblwrap td small{color:rgba(235,240,255,.5)}
.tblwrap td .sz{color:rgba(235,240,255,.5);font-size:12.5px;margin-left:4px}
.tblwrap td.sell{font-weight:600;color:#ffd9a0;font-size:16px}
.tblwrap tr.sethead td{padding-top:20px;color:#ffd9a0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border-bottom:0}
.tblwrap tr.setrow td{background:rgba(255,200,130,.07)}
.tblwrap tr.setrow td:first-child{border-radius:12px 0 0 12px;font-weight:600}
.tblwrap tr.setrow td:last-child{border-radius:0 12px 12px 0}
.pos{color:#ffd9a0}
.neg{color:#ff9a86}

/* ---- карта ---- */
.mapwrap{display:grid;grid-template-columns:1.75fr 1fr;gap:18px;align-items:start}
.mapbox{border:1px solid rgba(255,230,200,.16);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03)}
.mapbox svg{display:block;width:100%;height:auto}
.slide:not(.active) .mapbox *{animation-play-state:paused}
.grat{stroke:#fff;stroke-opacity:.045;stroke-width:1}
.gl{fill:#fff;fill-opacity:.22;font-size:10px}
.nb{fill:#fff;fill-opacity:.3;font-size:12px;text-anchor:middle;letter-spacing:.08em}
.scan{animation:mscan 8s linear infinite}
@keyframes mscan{from{transform:translateX(-140px)}to{transform:translateX(1040px)}}
.ctry{cursor:pointer}
.ctry .cfill{transition:fill-opacity .3s}
.ctry:hover .cfill{fill-opacity:.26}
.ctry.on .cfill{fill-opacity:.36}
.coutline{stroke-dasharray:1;stroke-dashoffset:1;pointer-events:none}
.slide.active .coutline{animation:mdraw 2.6s cubic-bezier(.2,.75,.2,1) .8s forwards}
@keyframes mdraw{to{stroke-dashoffset:0}}
.rl{fill:#fff;fill-opacity:.5;font-weight:900;font-size:21px;pointer-events:none;letter-spacing:.14em;text-anchor:middle}
.mk{cursor:pointer;opacity:0}
.slide.active .mk{animation:mfadeUp .7s cubic-bezier(.2,.75,.2,1) 1.9s both}
@keyframes mfadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mk .ring{fill:none;stroke:var(--c);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:mring 2.6s ease-out infinite}
.mk .r2{animation-delay:1.3s}
@keyframes mring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.mk .core{fill:var(--c);stroke:#07101a;stroke-width:2.5}
.mk .lab rect{fill:#07101a;fill-opacity:.88;stroke:var(--c);stroke-opacity:.65;transition:fill .25s}
.mk .lab text{fill:#fff;font-size:12px;font-weight:700;transition:fill .25s}
.mk:hover .lab rect,.mk.on .lab rect{fill:var(--c);fill-opacity:1}
.mk:hover .lab text,.mk.on .lab text{fill:#07101a}

vec3 bb(float t){

vec4 disk(vec3 hp,vec3 vdir){

const mobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)||Math.min(innerWidth,innerHeight)<600;
const N=mobile?3200:7500;
const PX=new Float32Array(N),PY=new Float32Array(N),PVX=new Float32Array(N),PVY=new Float32Array(N),
      PL=new Float32Array(N),PM=new Float32Array(N),PS=new Float32Array(N),PC=new Uint8Array(N),PMODE=new Uint8Array(N);
const COLS=['255,255,255','255,226,160','255,150,60','150,200,255','255,214,120','255,236,250'];
let head=0,alive=0;
const FX={drag:.7,trail:.2,attract:0,attractOn:false,spawnRate:0,outflow:false,swirl:0};
function spawn(x,y,vx,vy,life,size,col,mode){
  const i=head;head=(head+1)%N;
  PX[i]=x;PY[i]=y;PVX[i]=vx;PVY[i]=vy;PL[i]=life;PM[i]=life;PS[i]=size;PC[i]=col;PMODE[i]=mode;
}
function explode(){
  const cx=W/2,cy=H/2,md=Math.max(W,H);
  for(let i=0;i<N;i++){
    const a=rand(Math.PI*2),sp=Math.pow(Math.random(),.55)*md*.95*(.25+Math.random());
    const tang=rand(-.12,.12);
    const vx=Math.cos(a)*sp-Math.sin(a)*sp*tang,vy=Math.sin(a)*sp+Math.cos(a)*sp*tang;
    const k=sp/(md*.95);const c=k>.65?(Math.random()<.5?0:3):k>.3?(Math.random()<.6?1:0):2;
    spawn(cx+Math.cos(a)*rand(8),cy+Math.sin(a)*rand(8),vx,vy,rand(2.6,6.5),rand(1,2.8),c,0);
  }
  FX.drag=.75;FX.trail=.22;
}
function spawnAttract(n){
  const cx=W/2,cy=H/2,md=Math.hypot(W,H)/2;
  for(let i=0;i<n;i++){
    const a=rand(Math.PI*2),r=rand(md*.25,md*1.0);
    spawn(cx+Math.cos(a)*r,cy+Math.sin(a)*r,-Math.sin(a)*rand(20,120),Math.cos(a)*rand(20,120),rand(3,6),rand(.9,2.4),Math.random()<.5?0:(Math.random()<.5?1:3),1);
  }
}
function whiteBurst(){
  const cx=W/2,cy=H/2,md=Math.max(W,H);
  for(let i=0;i<N;i++) if(PL[i]>0){PMODE[i]=0;const a=Math.atan2(PY[i]-cy,PX[i]-cx),sp=rand(md*.2,md*1.1);PVX[i]=Math.cos(a)*sp;PVY[i]=Math.sin(a)*sp;PL[i]=PM[i]=rand(2.5,5);PC[i]=Math.random()<.5?4:5;}
  for(let k=0;k<(mobile?1200:2800);k++){const a=rand(Math.PI*2),sp=Math.pow(Math.random(),.6)*md*1.1;
    spawn(cx,cy,Math.cos(a)*sp,Math.sin(a)*sp,rand(2.5,6),rand(1,3),[0,4,5,4][k&3],0);}
  FX.drag=.55;FX.trail=.16;
}
function updateParticles(dt){
  const cx=W/2,cy=H/2;alive=0;
  if(FX.attractOn&&FX.spawnRate>0)spawnAttract(Math.floor(FX.spawnRate*dt+Math.random()));
  if(FX.outflow){const n=Math.floor((mobile?260:620)*dt+Math.random());
    for(let k=0;k<n;k++){const a=rand(Math.PI*2),sp=rand(120,520)*(Math.min(W,H)/800+.4);
      spawn(cx+Math.cos(a)*8,cy+Math.sin(a)*8,Math.cos(a)*sp,Math.sin(a)*sp,rand(2,4.5),rand(.8,2.2),[0,4,5,4,1][k%5],0);}}
  const dg=Math.exp(-FX.drag*dt);
  for(let i=0;i<N;i++){
    if(PL[i]<=0)continue;
    PL[i]-=dt;
    if(PMODE[i]===1){
      const dx=cx-PX[i],dy=cy-PY[i],d=Math.sqrt(dx*dx+dy*dy)+1;
      const k=FX.attract;
      PVX[i]+=(dx*k*.9+(-dy)*k*.7)*dt;PVY[i]+=(dy*k*.9+dx*k*.7)*dt;
      const dd=Math.exp(-.7*dt);PVX[i]*=dd;PVY[i]*=dd;
      if(d<16){PL[i]=0;continue;}
    }else{PVX[i]*=dg;PVY[i]*=dg;}
    PX[i]+=PVX[i]*dt;PY[i]+=PVY[i]*dt;
    if(PL[i]>0)alive++;
  }
}
function drawParticles(){
  const c=fxx;
  if(alive===0){c.clearRect(0,0,W,H);return;}
  c.globalCompositeOperation='destination-out';c.fillStyle='rgba(0,0,0,'+FX.trail+')';c.fillRect(0,0,W,H);
  c.globalCompositeOperation='lighter';
  for(let b=0;b<COLS.length;b++){
    const col=COLS[b];
    for(let i=0;i<N;i++){
      if(PL[i]<=0||PC[i]!==b)continue;
      const f=PL[i]/PM[i];const a=Math.min(1,f*2.2)*(PMODE[i]===1?.85:1);
      c.fillStyle='rgba('+col+','+a.toFixed(2)+')';
      const s=PS[i];c.fillRect(PX[i]-s/2,PY[i]-s/2,s,s);
    }
  }
}

/* ---------- оверлей: ядро, ударная волна, уроборос, пыль ---------- */
const R={core:0,shock:0,shockA:0,ringA:0,dustA:0,egg:0};
const dust=Array.from({length:mobile?110:240},()=>({x:Math.random(),y:Math.random(),r:rand(.4,1.5),ph:rand(6.28),sp:rand(.002,.01)}));
function rune(c,seed,sz){
  let s=seed*9301+49297;const r=()=>{s=(s*9301+49297)%233280;return s/233280;};
  c.beginPath();c.moveTo(0,-sz);c.lineTo(0,sz);
  const n=2+Math.floor(r()*2);
  for(let i=0;i<n;i++){const y=-sz+r()*sz*1.6,dx=(r()<.5?-1:1)*sz*(.4+r()*.5);c.moveTo(0,y);c.lineTo(dx,y+(r()<.5?-1:1)*sz*.55);}
  c.stroke();
}
function drawOuroboros(t,a){
  const c=rgx,cx=W/2,cy=H/2,Rr=Math.min(W,H)*(W<H?.36:.31);
  c.save();c.globalCompositeOperation='lighter';c.globalAlpha=a;c.translate(cx,cy);
  // мировое яйцо
  c.save();c.scale(.66,.9);c.strokeStyle='rgba(255,240,210,'+(.12+.06*Math.sin(t*1.3))+')';c.lineWidth=1.2;
  for(let k=0;k<3;k++){c.beginPath();c.arc(0,0,Rr*(.82+k*.07),0,Math.PI*2);c.stroke();}c.restore();
  // змей
  const SEG=200,start=t*.09,span=Math.PI*2*.962;
  for(let i=0;i<SEG;i++){
    const u=i/SEG,an=start+u*span,w=2+10*Math.pow(u,1.35);
    const x=Math.cos(an)*Rr,y=Math.sin(an)*Rr;
    const l=58+14*Math.sin(u*38-t*2.2);
    c.fillStyle='hsla('+(40+14*Math.sin(u*9+t))+',95%,'+l+'%,'+(.55+.4*u)+')';
    c.beginPath();c.arc(x,y,w,0,Math.PI*2);c.fill();
    if(i%4===0){c.strokeStyle='rgba(120,60,0,.35)';c.lineWidth=1;c.beginPath();c.arc(x,y,w*.8,an+1.2,an+1.9);c.stroke();}
  }
  const ha=start+span,hx=Math.cos(ha)*Rr,hy=Math.sin(ha)*Rr;
  c.save();c.translate(hx,hy);c.rotate(ha+Math.PI/2);
  c.fillStyle='rgba(255,226,150,.95)';c.beginPath();c.ellipse(0,-6,15,21,0,0,Math.PI*2);c.fill();
  c.fillStyle='rgba(255,255,255,1)';c.beginPath();c.arc(7,-10,2.6,0,Math.PI*2);c.fill();c.restore();
  // руны
  c.lineWidth=1.4;
  for(let ring=0;ring<2;ring++){
    const rad=Rr*(ring?1.3:1.17),cnt=ring?44:32,dir=ring?1:-1;
    c.strokeStyle='rgba(255,236,190,.28)';c.lineWidth=1;c.beginPath();c.arc(0,0,rad*(ring?1.045:.955),0,Math.PI*2);c.stroke();
    for(let k=0;k<cnt;k++){
      const an=dir*t*.05+k*Math.PI*2/cnt;
      c.save();c.rotate(an);c.translate(0,-rad);
      c.strokeStyle='rgba(255,238,200,'+(.45+.45*Math.sin(t*2+k*1.7))+')';c.lineWidth=1.4;rune(c,k*7+ring*131,7);c.restore();
    }
  }
  c.restore();
}
function drawOverlay(t,dt){
  const c=rgx;c.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2;
  if(R.core>0){
    const rad=14+R.core*46,g=c.createRadialGradient(cx,cy,0,cx,cy,rad*3);
    g.addColorStop(0,'rgba(255,255,255,'+Math.min(1,R.core*1.3)+')');g.addColorStop(.25,'rgba(255,190,110,'+R.core*.8+')');g.addColorStop(1,'rgba(255,100,20,0)');
    c.globalCompositeOperation='lighter';c.fillStyle=g;c.beginPath();c.arc(cx,cy,rad*3,0,Math.PI*2);c.fill();
  }
  if(R.shockA>0.01){
    c.globalCompositeOperation='lighter';
    const r=R.shock;
    const g=c.createRadialGradient(cx,cy,Math.max(0,r-90),cx,cy,r+6);
    g.addColorStop(0,'rgba(255,200,140,0)');g.addColorStop(.85,'rgba(255,215,170,'+(.22*R.shockA)+')');g.addColorStop(1,'rgba(255,255,255,'+(.9*R.shockA)+')');
    c.fillStyle=g;c.beginPath();c.arc(cx,cy,r+6,0,Math.PI*2);c.fill();
  }
  if(R.dustA>0.01){
    c.globalCompositeOperation='lighter';
    const white=S.white>.5;
    for(const d of dust){
      d.y-=d.sp*dt*(white?.5:1);d.x+=Math.sin(t*.2+d.ph)*.00008;if(d.y<-.02)d.y=1.02;
      const a=R.dustA*(.25+.75*(.5+.5*Math.sin(t*1.5+d.ph)))*.8;
      c.fillStyle=white?'rgba(255,230,170,'+a+')':'rgba(190,215,255,'+a+')';
      c.fillRect(d.x*W,d.y*H,d.r,d.r);
    }
  }
  if(R.ringA>0.01)drawOuroboros(t,R.ringA);
}

function initContent(){

    const inv=it.reduce((a,p)=>a+p.inv,0), del=it.reduce((a,p)=>a+DELIV[p.kind],0), single=it.reduce((a,p)=>a+p.sell,0);

  R.shockA=1;R.shock=0;tween(R,'shock',maxR(),2.7,E.out);tween(R,'shockA',0,2.7,E.in);

  FX.attractOn=true;FX.attract=0;FX.spawnRate=0;FX.trail=.13;FX.drag=.7;
  tween(FX,'spawnRate',mobile?900:2400,2.5,E.in);tween(FX,'attract',1.1,4.5,E.in);
  tween(M,'r',0,total/1000+.9,E.io);
  tween(S,'spin',9,.5,E.out);
  tween(S,'dist',26,2.6,E.expOut,2.0);tween(S,'spin',1.8,2.6,E.io,2.4);
  for(const h of hops){
    deck.style.setProperty('--td',Math.max(.14,h/1000*.85)+'s');
    setSlide(cur-1);await wait(h);
  }
  await wait(750);
  deck.style.visibility='hidden';deck.classList.remove('rew','masked');maskOn=false;rewOv.classList.remove('on');
  S.dist=26;
  await wait(1100);   // чёрная дыра рождена, напряжение
  // превращение
  A.whiteBuild(1.9);
  tween(S,'flash',1,1.9,E.in);tween(S,'shake',.7,1.9,E.in);tween(S,'spin',7,1.9,E.in);
  await wait(1900);
  S.white=1;S.dir=-1;S.spin=1.4;S.shake=0;S.dist=24;
  FX.attractOn=false;FX.outflow=true;whiteBurst();A.whiteHole();
  tween(S,'flash',0,2.6,E.out);tween(R,'ringA',1,3.5,E.out,.6);
  await wait(1600);
  finalEl.classList.add('show');
  await wait(3500);
  againBtn.classList.add('on');state='end';
}
FINAL_TEXT.split('').forEach((ch,i)=>{
  const s=document.createElement('span');s.textContent=ch===' '?'\u00a0':ch;
  s.style.animationDelay=(i*.09)+'s,'+(2.4+i*.12)+'s';finalEl.appendChild(s);
});

/* =====================================================================
   ГЛАВНЫЙ ЦИКЛ
   ===================================================================== */
let last=performance.now(),slow=0;
function frame(nowT){
  const dt=Math.min(.05,(nowT-last)/1000);last=nowT;time+=dt;
  stepTweens(dt);
  S.pulse*=Math.exp(-4*dt);
  const sp=(S.spin+S.pulse*3)*(state==='gate'?.6:1);
  S.phase+=dt*sp*S.dir;S.outPh+=dt*S.white*1.3;S.sky+=dt*(.004+.02*S.white);
  S.mx+=(S.tmx-S.mx)*Math.min(1,dt*2.5);S.my+=(S.tmy-S.my)*Math.min(1,dt*2.5);
  if(hasGL){
    gl.uniform2f(U.uRes,glc.width,glc.height);gl.uniform2f(U.uMouse,S.mx,S.my);
    gl.uniform1f(U.uTime,time);gl.uniform1f(U.uDist,S.dist);gl.uniform1f(U.uPhase,S.phase);gl.uniform1f(U.uOutPh,S.outPh);
    gl.uniform1f(U.uDir,S.dir);gl.uniform1f(U.uWhite,S.white);gl.uniform1f(U.uFlash,S.flash);gl.uniform1f(U.uShake,S.shake);gl.uniform1f(U.uSky,S.sky);
    gl.drawArrays(gl.TRIANGLES,0,3);
    // авто-качество
    if(dt>.026)slow++;else slow=Math.max(0,slow-1);
    if(slow>70&&Q>.5){Q*=.82;slow=0;resize();}
  }else{
    const sc=Math.min(1.4,26/S.dist);
    fb.style.transform='scale('+sc+') rotate('+(S.phase*30)+'deg)';
    fb.style.opacity=S.dist>800?0:1;
    fb.style.filter=S.white>.5?'hue-rotate(-20deg) brightness(1.6) saturate(.5)':'none';
    document.body.style.background=S.flash>0?'rgb('+Math.floor(S.flash*255)+','+Math.floor(S.flash*255)+','+Math.floor(S.flash*255)+')':'#000';
  }
  updateParticles(dt);drawParticles();drawOverlay(time,dt);
  if(maskOn)applyMask();
  if(stageShake>0.002){
    stageShake*=Math.exp(-3.2*dt);
    $('stage').style.transform='translate('+(rand(-1,1)*stageShake*16)+'px,'+(rand(-1,1)*stageShake*16)+'px)';
  }else if(stageShake!==0){stageShake=0;$('stage').style.transform='';}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
